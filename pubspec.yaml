name: flutter_spotify_remote
description: A Flutter plugin for Spotify App Remote SDK. Control playback, subscribe to player state, and manage auth on iOS and Android.
version: 0.0.3
homepage: https://github.com/ahsan-creates/flutter_spotify_remote
repository: https://github.com/ahsan-creates/flutter_spotify_remote
issue_tracker: https://github.com/ahsan-creates/flutter_spotify_remote/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

flutter:
  plugin:
    platforms:
      android:
        package: com.spotifyappremote.spotify_app_remote
        pluginClass: SpotifyAppRemotePlugin
      ios:
        pluginClass: SpotifyAppRemotePlugin

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
